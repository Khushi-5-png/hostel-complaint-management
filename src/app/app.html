<div class="complaint-container">

  <div class="complaint-card">

    <h1>Hostel Complaint Form</h1>
    <p class="subtitle">Submit your hostel complaint</p>

    <form (ngSubmit)="submitComplaint()">

      <div class="form-group">
        <label for="studentName">Student Name</label>
        <input
          type="text"
          id="studentName"
          name="studentName"
          [(ngModel)]="studentName"
          placeholder="Enter your name"
          required
        />
      </div>

      <div class="form-group">
        <label for="roomNumber">Room Number</label>
        <input
          type="text"
          id="roomNumber"
          name="roomNumber"
          [(ngModel)]="roomNumber"
          placeholder="Enter room number"
          required
        />
      </div>

      <div class="form-group">
        <label for="block">Block</label>
        <select
          id="block"
          name="block"
          [(ngModel)]="block"
          required
        >
          <option value="">Select Block</option>
          <option value="Block A">Block A</option>
          <option value="Block B">Block B</option>
          <option value="Block C">Block C</option>
        </select>
      </div>

      <div class="form-group">
        <label for="warden">Warden</label>
        <select
          id="warden"
          name="warden"
          [(ngModel)]="warden"
          required
        >
          <option value="">Select Warden</option>
          <option value="Pramila Dash">Pramila Dash</option>
          <option value="Parbati Mahapatra">Parbati Mahapatra</option>
          <option value="Rashmi Rekha Swain">Rashmi Rekha Swain</option>
          <option value="Binod Manjari">Binod Manjari</option>
          <option value="Kanaklata Jena">Kanaklata Jena</option>
        </select>
      </div>

      <!-- Send to Superintendent -->
      <div class="form-group">
        <label>Send complaint to Superintendent?</label>

        <div class="radio-group">
          <label>
            <input
              type="radio"
              name="sendToSuperintendent"
              [(ngModel)]="sendToSuperintendent"
              [value]="true"
            />
            Yes
          </label>

          <label>
            <input
              type="radio"
              name="sendToSuperintendent"
              [(ngModel)]="sendToSuperintendent"
              [value]="false"
            />
            No
          </label>
        </div>
      </div>

      <!-- Superintendent appears only for Yes -->
      <div
        class="form-group"
        *ngIf="sendToSuperintendent"
      >
        <label for="superintendent">Superintendent</label>

        <select
          id="superintendent"
          name="superintendent"
          [(ngModel)]="superintendent"
        >
          <option value="Basanta Manjari Dash">
            Basanta Manjari Dash
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="complaintType">Complaint Type</label>

        <select
          id="complaintType"
          name="complaintType"
          [(ngModel)]="complaintType"
          required
        >
          <option value="">Select Complaint Type</option>
          <option value="Water / Bathroom Leakage">
            Water / Bathroom Leakage
          </option>
          <option value="Electricity">Electricity</option>
          <option value="WiFi">WiFi</option>
          <option value="Food">Food</option>
          <option value="Room Cleaning">Room Cleaning</option>
          <option value="Furniture">Furniture</option>
          <option value="Door / Lock">Door / Lock</option>
          <option value="Security">Security</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Description</label>

        <textarea
          id="description"
          name="description"
          [(ngModel)]="description"
          rows="5"
          placeholder="Describe your complaint..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="photo">Upload Photo</label>

        <input
          type="file"
          id="photo"
          accept="image/*"
          (change)="onPhotoSelected($event)"
        />
      </div>

      <button type="submit">
        Submit Complaint
      </button>

    </form>

  </div>

</div>

<router-outlet></router-outlet><router-outlet></router-outlet>
